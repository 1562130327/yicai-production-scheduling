<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>溢彩包装 - 生产排单系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .navbar {
      background: rgba(255,255,255,0.95);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand { font-size: 20px; font-weight: bold; color: #333; }

    .nav-actions { display: flex; gap: 10px; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5a6fd6; transform: translateY(-2px); }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-secondary:hover { background: #e0e0e0; }

    .content { padding: 20px 30px; }

    /* 统计卡片 */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .stat-card h3 { color: #666; font-size: 14px; margin-bottom: 8px; }
    .stat-card .value { font-size: 36px; font-weight: bold; color: #667eea; }

    /* 气泡区域标题 */
    .bubble-section-title {
      font-size: 18px;
      font-weight: 600;
      color: white;
      margin-bottom: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    /* 工艺气泡 */
    .process-bubbles {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .process-bubble {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      color: white;
      text-align: center;
    }

    .process-bubble:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 35px rgba(0,0,0,0.3);
    }

    .process-bubble.active {
      box-shadow: 0 0 0 4px white, 0 0 0 8px #667eea;
    }

    .process-bubble .icon { font-size: 28px; margin-bottom: 8px; }
    .process-bubble .count { font-size: 32px; font-weight: bold; }
    .process-bubble .name { font-size: 13px; opacity: 0.9; margin-top: 5px; }

    /* 气泡颜色 */
    .bubble-片材 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .bubble-切片 { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
    .bubble-冲型 { background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%); }
    .bubble-背胶 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .bubble-库存 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .bubble-其他 { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
    .bubble-全部 { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333; }

    /* 客户气泡 */
    .customer-bubbles {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .customer-bubble {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      color: #333;
      text-align: center;
    }

    .customer-bubble:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .customer-bubble.active {
      box-shadow: 0 0 0 3px #667eea;
    }

    .customer-bubble .name { font-size: 14px; font-weight: 600; }
    .customer-bubble .count { font-size: 20px; font-weight: bold; color: #667eea; }

    /* 订单列表 */
    .orders-section {
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .orders-title { font-size: 18px; font-weight: 600; color: #333; }

    .search-box {
      padding: 10px 20px;
      border: 1px solid #ddd;
      border-radius: 25px;
      font-size: 14px;
      width: 300px;
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .order-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-left: 5px solid #667eea;
      cursor: pointer;
      transition: all 0.3s;
    }

    .order-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .order-card.priority-特急 { border-left-color: #e74c3c; }
    .order-card.priority-注意 { border-left-color: #f39c12; }
    .order-card.priority-普通 { border-left-color: #3498db; }
    .order-card.priority-低 { border-left-color: #95a5a6; }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .order-customer { font-size: 16px; font-weight: 600; color: #333; }

    .order-tag {
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 500;
    }

    .tag-特急 { background: #f8d7da; color: #721c24; }
    .tag-注意 { background: #fff3cd; color: #856404; }
    .tag-普通 { background: #d1ecf1; color: #0c5460; }
    .tag-低 { background: #e2e3e5; color: #383d41; }

    .order-info {
      font-size: 13px;
      color: #666;
      line-height: 1.8;
    }

    .order-info span { display: block; }
    .order-info b { color: #333; }

    .order-footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-status {
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-待分配 { background: #e3f2fd; color: #1976d2; }
    .status-已分配 { background: #fff3cd; color: #856404; }
    .status-待排产 { background: #e3f2fd; color: #1976d2; }
    .status-生产中 { background: #fff3cd; color: #856404; }
    .status-已完成 { background: #d4edda; color: #155724; }

    .empty-tip {
      text-align: center;
      color: #999;
      padding: 40px;
    }

    @media (max-width: 768px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .process-bubble { width: 100px; height: 100px; }
      .customer-bubble { width: 80px; height: 80px; }
      .orders-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">溢彩包装 - 生产排单系统</div>
    <div class="nav-actions">
      <a href="workshop-map.html" class="btn btn-secondary">车间地图</a>
      <a href="schedule.html" class="btn btn-secondary">排单总表</a>
      <a href="inventory.html" class="btn btn-secondary">库存管理</a>
      <a href="new-order.html" class="btn btn-primary">+ 新增订单</a>
      <a href="merchandiser-dashboard.html" id="workerLink" class="btn btn-secondary" style="display:none;">跟单工作台</a>
      <a href="login.html" id="loginLink" class="btn btn-secondary">登录</a>
      <a href="admin.html" id="adminLink" class="btn btn-secondary" style="display:none;">管理后台</a>
    </div>
  </nav>

  <div class="content">
    <!-- 统计卡片 -->
    <div class="stats-row">
      <div class="stat-card">
        <h3>总订单数</h3>
        <div class="value" id="totalOrders">0</div>
      </div>
      <div class="stat-card">
        <h3>紧急/注意</h3>
        <div class="value" id="urgentOrders" style="color: #e74c3c;">0</div>
      </div>
      <div class="stat-card">
        <h3>生产中</h3>
        <div class="value" id="inProgressOrders" style="color: #f39c12;">0</div>
      </div>
      <div class="stat-card">
        <h3>已完成</h3>
        <div class="value" id="completedOrders" style="color: #27ae60;">0</div>
      </div>
    </div>

    <!-- 工艺气泡 -->
    <div class="bubble-section-title">按加工工艺分类</div>
    <div class="process-bubbles" id="processBubbles"></div>

    <!-- 客户气泡 -->
    <div class="bubble-section-title">按客户分类</div>
    <div class="customer-bubbles" id="customerBubbles"></div>

    <!-- 订单列表 -->
    <div class="orders-section">
      <div class="orders-header">
        <div class="orders-title">订单列表</div>
        <input type="text" class="search-box" placeholder="🔍 搜索客户、材料、款号..." id="searchInput" oninput="filterOrders()">
      </div>
      <div class="orders-grid" id="ordersGrid"></div>
    </div>
  </div>

  <script>
    let allOrders = [];
    let currentProcess = '';
    let currentCustomer = '';

    document.addEventListener('DOMContentLoaded', function() {
      const userStr = localStorage.getItem('currentUser');
      if (userStr) {
        const user = JSON.parse(userStr);
        document.getElementById('loginLink').textContent = '退出';
        document.getElementById('loginLink').href = '#';
        document.getElementById('loginLink').onclick = function(e) {
          e.preventDefault();
          localStorage.removeItem('currentUser');
          localStorage.removeItem('authToken');
          window.location.href = 'index.html';
        };
        // Show role-specific buttons
        if (user.role === '管理员') {
          document.getElementById('adminLink').style.display = 'inline-flex';
        }
        if (user.role === '师傅') {
          document.getElementById('workerLink').style.display = 'inline-flex';
        }
      }
      loadOrders();
    });

    async function loadOrders() {
      try {
        const response = await fetch('/api/schedule');
        allOrders = await response.json();
        updateStats();
        renderProcessBubbles();
        renderCustomerBubbles();
        renderOrders();
      } catch (error) {
        console.error('加载数据失败:', error);
      }
    }

    function updateStats() {
      document.getElementById('totalOrders').textContent = allOrders.length;
      document.getElementById('urgentOrders').textContent = allOrders.filter(o =>
        o.priority === '特急' || o.priority === '注意'
      ).length;
      document.getElementById('inProgressOrders').textContent = allOrders.filter(o =>
        o.status === '生产中'
      ).length;
      document.getElementById('completedOrders').textContent = allOrders.filter(o =>
        o.status === '已完成' || o.completed === '完单'
      ).length;
    }

    function renderProcessBubbles() {
      const container = document.getElementById('processBubbles');

      // 按工艺分组
      const grouped = {};
      allOrders.forEach(o => {
        const pt = o.process_type || '其他';
        grouped[pt] = (grouped[pt] || 0) + 1;
      });

      // 根据工艺类型确定气泡样式
      const getBubbleClass = (type) => {
        if (type.includes('片材')) return 'bubble-片材';
        if (type.includes('切片')) return 'bubble-切片';
        if (type.includes('冲型')) return 'bubble-冲型';
        if (type.includes('背胶')) return 'bubble-背胶';
        if (type.includes('库存')) return 'bubble-库存';
        return 'bubble-其他';
      };

      let html = `
        <div class="process-bubble bubble-全部 ${currentProcess === '' ? 'active' : ''}" onclick="filterByProcess('')">
          <div class="icon">📋</div>
          <div class="count">${allOrders.length}</div>
          <div class="name">全部</div>
        </div>
      `;

      Object.entries(grouped)
        .sort((a, b) => b[1] - a[1])
        .forEach(([type, count]) => {
          html += `
            <div class="process-bubble ${getBubbleClass(type)} ${currentProcess === type ? 'active' : ''}" onclick="filterByProcess('${type}')">
              <div class="count">${count}</div>
              <div class="name">${type}</div>
            </div>
          `;
        });

      container.innerHTML = html;
    }

    function renderCustomerBubbles() {
      const container = document.getElementById('customerBubbles');

      // 按客户分组
      const grouped = {};
      allOrders.forEach(o => {
        const c = o.customer || '未知';
        grouped[c] = (grouped[c] || 0) + 1;
      });

      let html = `
        <div class="customer-bubble ${currentCustomer === '' ? 'active' : ''}" onclick="filterByCustomer('')">
          <div class="name">全部</div>
          <div class="count">${allOrders.length}</div>
        </div>
      `;

      Object.entries(grouped)
        .sort((a, b) => b[1] - a[1])
        .forEach(([name, count]) => {
          html += `
            <div class="customer-bubble ${currentCustomer === name ? 'active' : ''}" onclick="filterByCustomer('${name}')">
              <div class="name">${name}</div>
              <div class="count">${count}</div>
            </div>
          `;
        });

      container.innerHTML = html;
    }

    function filterByProcess(process) {
      currentProcess = process;
      currentCustomer = '';
      renderProcessBubbles();
      renderCustomerBubbles();
      renderOrders();
    }

    function filterByCustomer(customer) {
      currentCustomer = customer;
      currentProcess = '';
      renderProcessBubbles();
      renderCustomerBubbles();
      renderOrders();
    }

    function filterOrders() {
      renderOrders();
    }

    function renderOrders() {
      const container = document.getElementById('ordersGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();

      let filtered = allOrders;

      if (currentProcess) {
        filtered = filtered.filter(o => o.process_type === currentProcess);
      }

      if (currentCustomer) {
        filtered = filtered.filter(o => o.customer === currentCustomer);
      }

      if (search) {
        filtered = filtered.filter(o =>
          (o.customer || '').toLowerCase().includes(search) ||
          (o.material || '').toLowerCase().includes(search) ||
          (o.process_type || '').toLowerCase().includes(search) ||
          (o.order_no || '').toLowerCase().includes(search)
        );
      }

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-tip">暂无订单数据</div>';
        return;
      }

      // 根据 status 字段分类
      const inProgress = filtered.filter(o => o.status === '生产中');
      const pending = filtered.filter(o => !o.status || o.status === '待分配' || o.status === '已分配' || o.status === '待排产');
      const completed = filtered.filter(o => o.status === '已完成' || o.completed === '完单');

      let html = '';

      // 进行中的订单
      if (inProgress.length > 0) {
        html += '<div style="margin-bottom: 15px; font-size: 14px; color: #f39c12; font-weight: 600;">⚡ 生产中 (' + inProgress.length + ')</div>';
        html += inProgress.map(order => renderOrderCard(order, true)).join('');
      }

      // 待生产的订单
      if (pending.length > 0) {
        html += '<div style="margin-bottom: 15px; margin-top: 20px; font-size: 14px; color: #666; font-weight: 600;">📋 待生产 (' + pending.length + ')</div>';
        html += pending.map(order => renderOrderCard(order, false)).join('');
      }

      // 已完成的订单
      if (completed.length > 0) {
        html += '<div style="margin-bottom: 15px; margin-top: 20px; font-size: 14px; color: #27ae60; font-weight: 600;">✅ 已完成 (' + completed.length + ')</div>';
        html += completed.map(order => renderOrderCard(order, false)).join('');
      }

      container.innerHTML = html;
    }

    function renderOrderCard(order, showProgress) {
      // 确定当前进行中的流程
      let currentStep = '';
      let casualWorkers = 0;

      if (order.sheet_done && !order.slice_done && !order.punch_done) {
        currentStep = '片材工序';
        casualWorkers = 2;
      } else if (order.slice_done && !order.punch_done) {
        currentStep = '切片工序';
        casualWorkers = 1;
      } else if (order.punch_done) {
        currentStep = '冲型工序';
        casualWorkers = 2;
      }

      // 根据工艺判断需要的零工
      const processType = order.process_type || '';
      if (processType.includes('背胶')) casualWorkers += 1;
      if (processType.includes('贴布')) casualWorkers += 2;

      return `
        <div class="order-card priority-${order.priority || '普通'}" onclick="viewOrder(${order.id})">
          <div class="order-header">
            <div class="order-customer">${order.customer || '-'}</div>
            <span class="order-tag tag-${order.priority || '普通'}">${order.priority || '普通'}</span>
          </div>
          <div class="order-info">
            <span><b>订单号:</b> ${order.order_no || '-'}</span>
            <span><b>工艺:</b> ${order.process_type || '-'}</span>
            <span><b>用料:</b> ${order.material || '-'}</span>
            <span><b>片材:</b> ${order.sheet_size || '-'}</span>
            <span><b>数量:</b> ${order.sheet_qty || '-'}</span>
          </div>
          ${showProgress && currentStep ? `
          <div style="margin-top: 10px; padding: 10px; background: #fff3cd; border-radius: 6px; font-size: 13px;">
            <div style="color: #856404;"><b>当前工序:</b> ${currentStep}</div>
            <div style="color: #856404;"><b>零工需求:</b> ${casualWorkers} 人</div>
            ${order.sheet_done ? '<div style="color: #27ae60;">✓ 已开片材: ' + order.sheet_done + '</div>' : ''}
            ${order.slice_done ? '<div style="color: #27ae60;">✓ 已切片: ' + order.slice_done + '</div>' : ''}
            ${order.punch_done ? '<div style="color: #27ae60;">✓ 已冲型: ' + order.punch_done + '</div>' : ''}
          </div>
          ` : ''}
          <div class="order-footer">
            <span class="order-status status-${order.status || '待分配'}">${order.status || '待分配'}</span>
            ${order.remark ? '<span style="color:#999;font-size:12px;">📝 有备注</span>' : ''}
          </div>
        </div>
      `).join('');
    }

    function viewOrder(id) {
      localStorage.setItem('lastViewOrder', JSON.stringify(allOrders.find(o => o.id === id)));
      window.location.href = `order-detail.html?id=${id}`;
    }
  </script>
</body>
</html>
